# Every 3 hours: pull the latest Open-Meteo readings and save them in the repo (data/live/*.csv).
name: collect-live-data
on:
  schedule: [{ cron: "7 */3 * * *" }]
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "Optional one-off history fill, e.g. 2022-08-01 (first run: do this once)"
        required: false
permissions: { contents: write }
concurrency: { group: data-writes, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Backfill history (manual runs only)
        if: ${{ github.event.inputs.backfill_from != '' }}
        run: python -m pipeline.ingest backfill --start "${{ github.event.inputs.backfill_from }}"
      - run: python -m pipeline.ingest live
      - name: Commit data
        run: |
          git config user.name "hawa-bot"; git config user.email "hawa-bot@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet || (git commit -m "data: live readings $(date -u +%FT%TZ)" && git pull --rebase && git push)
